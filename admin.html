<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin System - Spatial Drafting Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #050505;
      color: #fff;
      padding: 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; }
    
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .currency-select {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .currency-select:hover, .currency-select:focus {
      border-color: rgba(255,255,255,0.4);
    }
    .currency-select option {
      background: #111;
      color: #fff;
    }
    
    .override-panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .override-panel h2 { font-size: 1rem; color: rgba(255,255,255,0.6); }
    .queue-input {
      background: #000;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 100px;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
    }
    .btn-save {
      background: #fff; color: #000;
      border: none; padding: 12px 24px; font-weight: 600; cursor: pointer; border-radius: 4px;
    }
    .btn-save:hover { background: #e0e0e0; }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    th {
      color: rgba(255,255,255,0.4);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    td { font-size: 0.9rem; color: rgba(255,255,255,0.8); }
    
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-lead { background: rgba(255, 165, 0, 0.2); color: orange; }
    .status-prod { background: rgba(0, 191, 255, 0.2); color: #00bfff; }
    .status-shipped { background: rgba(0, 255, 0, 0.2); color: #4ade80; }
    
    .thumbnail {
      width: 40px; height: 40px; border-radius: 4px; object-fit: cover;
    }

    /* Responsive Table Styles */
    @media (max-width: 768px) {
      body { padding: 20px; }
      table, thead, tbody, th, td, tr {
        display: block;
      }
      thead tr {
        position: absolute;
        top: -9999px;
        left: -9999px;
      }
      tr {
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 8px;
        margin-bottom: 16px;
        padding: 12px;
        background: rgba(255,255,255,0.02);
      }
      td {
        border: none;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: relative;
        padding-left: 120px;
        margin-bottom: 8px;
      }
      td:last-child {
        border-bottom: 0;
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 0;
        top: 16px;
        width: 100px;
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: rgba(255,255,255,0.4);
      }
      td[data-label="Invoice"] {
        font-size: 1.2rem;
      }
      .override-panel {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Back-Office Pipeline Dashboard</h1>
    <div class="header-actions">
      <select id="currency-select" class="currency-select">
        <!-- Injected via JS -->
      </select>
      <div style="font-size: 0.85rem; color: rgba(255,255,255,0.5);">System Status: Secure</div>
    </div>
  </header>

  <div class="override-panel">
    <div>
      <h2>Global Queue Delay Buffer (Weeks)</h2>
      <p style="font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 4px;">Adjusts public baseline timeline calculations.</p>
    </div>
    <input type="number" id="queue-buffer" class="queue-input" value="2" min="0" max="10">
    <button class="btn-save" id="btn-save-buffer">OVERRIDE TIMELINE</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Client ID</th>
        <th>Architecture Format</th>
        <th>Concept Stream</th>
        <th>Reference Asssets</th>
        <th>Invoice</th>
        <th>Workflow Status</th>
      </tr>
    </thead>
    <tbody id="orders-tbody">
      <!-- Mock Data injected via JS -->
    </tbody>
  </table>

  <script src="src/admin.js"></script>
</body>
</html>
