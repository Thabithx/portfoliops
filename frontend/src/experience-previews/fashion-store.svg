<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.06);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="65" fill="rgba(26,26,46,0.9)" />
  <text x="40" y="42" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="white" letter-spacing="2">LUXE</text>
  <text x="85" y="42" font-family="Georgia, serif" font-size="20" font-weight="300" fill="rgba(255,255,255,0.7)" letter-spacing="2">FASHION</text>
  
  <!-- Nav -->
  <rect x="200" y="22" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="235" y="37" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">New</text>
  <rect x="280" y="22" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="315" y="37" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Women</text>
  <rect x="360" y="22" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="395" y="37" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Men</text>
  <rect x="440" y="22" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="475" y="37" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">Sale</text>
  
  <!-- Cart Icon -->
  <rect x="720" y="22" width="50" height="22" rx="4" fill="#10b981" />
  <text x="745" y="37" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">CART (2)</text>
  
  <!-- Hero Banner -->
  <rect x="20" y="85" width="760" height="200" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" />
  <rect x="40" y="105" width="300" height="160" rx="12" fill="rgba(236,72,153,0.2)" />
  <rect x="60" y="125" width="260" height="120" rx="8" fill="rgba(255,255,255,0.1)" />
  <text x="380" y="140" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="white">Summer Collection</text>
  <text x="380" y="175" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)">Discover the latest trends in luxury fashion</text>
  <rect x="380" y="200" width="130" height="38" rx="8" fill="#ec4899" filter="url(#glow)" />
  <text x="445" y="224" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Shop Now</text>
  
  <!-- Product Grid -->
  <rect x="20" y="305" width="175" height="275" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="35" y="320" width="145" height="160" rx="8" fill="rgba(56,189,248,0.15)" />
  <rect x="50" y="340" width="115" height="120" rx="6" fill="rgba(255,255,255,0.1)" />
  <text x="35" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Silk Blouse</text>
  <text x="35" y="525" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Premium silk</text>
  <text x="35" y="560" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ec4899">$189</text>
  
  <rect x="210" y="305" width="175" height="275" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="225" y="320" width="145" height="160" rx="8" fill="rgba(56,189,248,0.15)" />
  <rect x="240" y="340" width="115" height="120" rx="6" fill="rgba(255,255,255,0.1)" />
  <text x="225" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Cashmere Sweater</text>
  <text x="225" y="525" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">100% cashmere</text>
  <text x="225" y="560" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ec4899">$245</text>
  
  <rect x="400" y="305" width="175" height="275" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="415" y="320" width="145" height="160" rx="8" fill="rgba(56,189,248,0.15)" />
  <rect x="430" y="340" width="115" height="120" rx="6" fill="rgba(255,255,255,0.1)" />
  <text x="415" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Linen Dress</text>
  <text x="415" y="525" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Breathable fabric</text>
  <text x="415" y="560" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ec4899">$165</text>
  
  <rect x="590" y="305" width="190" height="275" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="605" y="320" width="160" height="160" rx="8" fill="rgba(56,189,248,0.15)" />
  <rect x="620" y="340" width="130" height="120" rx="6" fill="rgba(255,255,255,0.1)" />
  <text x="605" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Designer Jacket</text>
  <text x="605" y="525" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Limited edition</text>
  <text x="605" y="560" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ec4899">$389</text>
  
  <!-- Payment Icons -->
  <rect x="20" y="590" width="30" height="20" rx="3" fill="rgba(255,255,255,0.15)" />
  <text x="35" y="604" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">VISA</text>
  <rect x="55" y="590" width="30" height="20" rx="3" fill="rgba(255,255,255,0.15)" />
  <text x="70" y="604" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">MC</text>
  <rect x="90" y="590" width="30" height="20" rx="3" fill="rgba(255,255,255,0.15)" />
  <text x="105" y="604" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" text-anchor="middle">AMEX</text>
</svg>
