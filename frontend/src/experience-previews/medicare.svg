  <text x="510" y="34" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)">Search...</text>
  
  <!-- Notification Bell -->
  <circle cx="660" cy="30" r="14" fill="rgba(255,255,255,0.1)" />
  <circle cx="666" cy="24" r="4" fill="#ef4444" />
  
  <!-- Stats Cards -->
  <rect x="200" y="80" width="170" height="100" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" />
  <text x="215" y="105" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Total Patients</text>
  <text x="215" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">2,847</text>
  <text x="215" y="160" font-family="Arial, sans-serif" font-size="10" fill="#10b981">↑ 12% this month</text>
  
  <rect x="385" y="80" width="170" height="100" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" />
