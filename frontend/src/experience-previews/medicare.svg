  <rect x="330" y="245" width="100" height="25" rx="4" fill="rgba(255,255,255,0.05)" />
  <text x="380" y="262" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">Doctor</text>
  <rect x="440" y="245" width="100" height="25" rx="4" fill="rgba(255,255,255,0.05)" />
