<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="600" fill="rgba(12,25,41,0.95)" />
  
  <!-- Logo -->
  <rect x="20" y="20" width="140" height="45" rx="8" fill="#ef4444" filter="url(#glow)" />
  <text x="90" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">MEDICARE</text>
  
  <!-- Sidebar Menu -->
  <rect x="15" y="85" width="150" height="40" rx="6" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)" />
  <text x="90" y="110" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Dashboard</text>
  
  <rect x="15" y="135" width="150" height="40" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="90" y="160" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Patients</text>
  
  <rect x="15" y="185" width="150" height="40" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="90" y="210" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Doctors</text>
  
  <rect x="15" y="235" width="150" height="40" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="90" y="260" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Appointments</text>
  
  <rect x="15" y="285" width="150" height="40" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="90" y="310" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Billing</text>
  
  <rect x="15" y="335" width="150" height="40" rx="6" fill="rgba(255,255,255,0.05)" />
  <text x="90" y="360" font-family="Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" text-anchor="middle">Reports</text>
  
  <!-- User Profile -->
  <rect x="15" y="530" width="150" height="55" rx="8" fill="rgba(255,255,255,0.05)" />
  <circle cx="45" cy="557" r="18" fill="rgba(56,189,248,0.3)" />
  <text x="45" y="562" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">DR</text>
  <text x="75" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Dr. Smith</text>
  <text x="75" y="565" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)">Admin</text>
  
  <!-- Main Content Area -->
  <rect x="180" y="0" width="620" height="600" fill="url(#bgGrad)" />
  
  <!-- Top Bar -->
  <rect x="180" y="0" width="620" height="60" fill="rgba(12,25,41,0.8)" />
  <text x="200" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Dashboard</text>
  
  <!-- Search -->
