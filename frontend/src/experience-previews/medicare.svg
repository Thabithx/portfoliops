  <text x="340" y="294" font-family="Arial, sans-serif" font-size="11" fill="white">Dr. Smith</text>
  <text x="450" y="294" font-family="Arial, sans-serif" font-size="11" fill="white">09:00 AM</text>
  <rect x="550" y="282" width="60" height="16" rx="8" fill="#10b981" />
  <text x="580" y="293" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Done</text>
  
  <rect x="220" y="310" width="500" height="30" rx="4" fill="rgba(255,255,255,0.02)" />
  <text x="230" y="329" font-family="Arial, sans-serif" font-size="11" fill="white">Jane Smith</text>
  <text x="340" y="329" font-family="Arial, sans-serif" font-size="11" fill="white">Dr. Johnson</text>
  <text x="450" y="329" font-family="Arial, sans-serif" font-size="11" fill="white">10:30 AM</text>
  <rect x="550" y="317" width="60" height="16" rx="8" fill="#f59e0b" />
  <text x="580" y="328" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Pending</text>
  
  <rect x="220" y="345" width="500" height="30" rx="4" fill="rgba(255,255,255,0.02)" />
  <text x="230" y="364" font-family="Arial, sans-serif" font-size="11" fill="white">Bob Wilson</text>
  <text x="340" y="364" font-family="Arial, sans-serif" font-size="11" fill="white">Dr. Williams</text>
  <text x="450" y="364" font-family="Arial, sans-serif" font-size="11" fill="white">11:00 AM</text>
  <rect x="550" y="352" width="60" height="16" rx="8" fill="#10b981" />
  <text x="580" y="363" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">Done</text>
  
  <!-- Quick Actions -->
  <rect x="200" y="420" width="260" height="150" rx="12" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" />
  <text x="220" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Quick Actions</text>
  
  <rect x="220" y="465" width="100" height="35" rx="8" fill="#ef4444" />
  <text x="270" y="487" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">New Patient</text>
  
  <rect x="330" y="465" width="100" height="35" rx="8" fill="rgba(255,255,255,0.1)" />
  <text x="380" y="487" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Schedule</text>
  
  <rect x="220" y="510" width="100" height="35" rx="8" fill="rgba(255,255,255,0.1)" />
  <text x="270" y="532" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Reports</text>
  
  <rect x="330" y="510" width="100" height="35" rx="8" fill="rgba(255,255,255,0.1)" />
  <text x="380" y="532" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Settings</text>
  
  <!-- Activity Feed -->
  <rect x="480" y="420" width="260" height="150" rx="12" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" />
  <text x="500" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Recent Activity</text>
  
  <circle cx="500" cy="475" r="4" fill="#10b981" />
  <text x="515" y="479" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">New patient registered</text>
  <text x="680" y="479" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">2m ago</text>
  
  <circle cx="500" cy="500" r="4" fill="#f59e0b" />
  <text x="515" y="504" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Appointment rescheduled</text>
  <text x="680" y="504" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">15m ago</text>
  
  <circle cx="500" cy="525" r="4" fill="#ef4444" />
  <text x="515" y="529" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">System alert resolved</text>
  <text x="680" y="529" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">1h ago</text>
  
  <circle cx="500" cy="550" r="4" fill="#10b981" />
  <text x="515" y="554" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)">Report generated</text>
  <text x="680" y="554" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">2h ago</text>
</svg>
