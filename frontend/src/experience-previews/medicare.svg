  <text x="400" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">48</text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="10" fill="#10b981">↑ 3 new</text>
  
  <rect x="570" y="80" width="170" height="100" rx="10" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.1)" />
  <text x="585" y="105" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Today's Appointments</text>
  <text x="585" y="135" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">156</text>
  <text x="585" y="160" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">8 pending</text>
  
  <!-- Recent Appointments Table -->
