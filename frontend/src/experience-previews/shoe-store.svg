<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="rgba(15,15,35,0.95)" />
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" letter-spacing="3">ALLAIA</text>
  
  <!-- Search Bar -->
  <rect x="200" y="18" width="300" height="24" rx="12" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" />
  <text x="215" y="34" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Search shoes...</text>
  
  <!-- Nav -->
  <rect x="520" y="20" width="60" height="20" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="550" y="34" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Men</text>
  <rect x="590" y="20" width="60" height="20" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="620" y="34" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Women</text>
  <rect x="660" y="20" width="60" height="20" rx="4" fill="rgba(255,255,255,0.08)" />
  <text x="690" y="34" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">Kids</text>
  
  <!-- Cart -->
  <circle cx="760" cy="30" r="16" fill="#f59e0b" filter="url(#glow)" />
  <text x="760" y="34" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">4</text>
  
  <!-- Hero Section -->
  <rect x="20" y="80" width="760" height="160" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" />
  <rect x="50" y="100" width="280" height="120" rx="12" fill="rgba(245,158,11,0.2)" />
  <ellipse cx="190" cy="160" rx="100" ry="35" fill="rgba(255,255,255,0.15)" />
  <text x="360" y="130" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Step Into Style</text>
  <text x="360" y="160" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)">Premium footwear for every occasion</text>
  <rect x="360" y="185" width="120" height="32" rx="8" fill="#f59e0b" />
  <text x="420" y="206" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Explore</text>
  
  <!-- Category Pills -->
  <rect x="20" y="260" width="100" height="30" rx="15" fill="#f59e0b" />
  <text x="70" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">All</text>
  <rect x="130" y="260" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" />
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Running</text>
  <rect x="240" y="260" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" />
  <text x="290" y="280" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Casual</text>
  <rect x="350" y="260" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" />
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Formal</text>
  <rect x="460" y="260" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" />
  <text x="510" y="280" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Sports</text>
  
  <!-- Product Grid -->
  <rect x="20" y="310" width="180" height="270" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="35" y="325" width="150" height="150" rx="10" fill="rgba(56,189,248,0.15)" />
  <ellipse cx="110" cy="400" rx="55" ry="25" fill="rgba(255,255,255,0.1)" />
  <text x="35" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Air Max Pro</text>
  <text x="35" y="518" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Running shoes</text>
  <text x="35" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">$179</text>
  
  <rect x="215" y="310" width="180" height="270" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="230" y="325" width="150" height="150" rx="10" fill="rgba(56,189,248,0.15)" />
  <ellipse cx="305" cy="400" rx="55" ry="25" fill="rgba(255,255,255,0.1)" />
  <text x="230" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Classic Leather</text>
  <text x="230" y="518" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Casual wear</text>
  <text x="230" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">$129</text>
  
  <rect x="410" y="310" width="180" height="270" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="425" y="325" width="150" height="150" rx="10" fill="rgba(56,189,248,0.15)" />
  <ellipse cx="500" cy="400" rx="55" ry="25" fill="rgba(255,255,255,0.1)" />
  <text x="425" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Ultra Boost</text>
  <text x="425" y="518" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Performance</text>
  <text x="425" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">$199</text>
  
  <rect x="605" y="310" width="175" height="270" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" />
  <rect x="620" y="325" width="145" height="150" rx="10" fill="rgba(56,189,248,0.15)" />
  <ellipse cx="692" cy="400" rx="52" ry="25" fill="rgba(255,255,255,0.1)" />
  <text x="620" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Street Elite</text>
  <text x="620" y="518" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)">Urban style</text>
  <text x="620" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">$149</text>
  
  <!-- Filter Badge -->
  <rect x="680" y="260" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" />
  <text x="730" y="280" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">Filter ↓</text>
</svg>
